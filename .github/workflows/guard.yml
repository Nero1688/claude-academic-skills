name: guard

# 公開包的守門員。每次 push 與 PR 都跑，任何一項不過就擋下。
#
# 存在理由：本 repo 的內容由私人開發庫同步產生，但**任何人（包括維護者本人）
# 都可能直接在這裡手動改動**。手動改動不會經過同步工具的閘門，因此需要一道
# 獨立於同步流程、直接長在 repo 上的防線。
#
# 2026-09-02 的實際教訓：一次同步把先前手動修好的 16 處跨指全部蓋回去，
# 而當時沒有任何機制會發現。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      # CI 環境本來就不會有私密置換表／私密樣式檔,明確聲明「本來就沒有」而非
      # 靜默略過(H3):sanitize_check.sh 找不到私密檔時,沒有這個變數就會 FAIL。
      SANITIZE_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（M6：SHA 釘住，用 gh api 查得，2026-09-20）

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0（M6：SHA 釘住，同上）
        with:
          python-version: '3.12'

      # runner 預設沒有 pyyaml，最後一步的 frontmatter 解析需要它。
      - name: 安裝相依
        run: python -m pip install --quiet pyyaml python-pptx==1.0.2

      # 敏感資訊掃描：本機路徑、硬編碼金鑰、Bearer token、學號樣式等。
      # 個人化樣式存放於 repo 外的私密檔，CI 上不存在，故此處僅跑通用樣式——
      # 這正是我們要的：公開 repo 的檢查不該依賴任何私有資訊。
      - name: 敏感資訊掃描
        run: bash scripts/sanitize_check.sh .

      # M6 新增（2026-09-20）：五類資安掃描（危險執行／網路外連／混淆／憑證／提示注入）。
      # --selftest 先驗證掃描器本身抓得到已知繞過變體（誘餌自測，任一類漏抓即 exit 1），
      # 再對 repo 實跑一次；兩者都應零「待確認」（已登記的誤報見 scripts/security_allow.txt）。
      - name: 資安掃描自測（誘餌）
        run: bash scripts/security_scan.sh --selftest

      - name: 資安掃描（skills/scripts/tools）
        run: bash scripts/security_scan.sh

      # M6 新增：語法編譯檢查——L-029 那種 SyntaxWarning 過去只有本機看得到，CI 沒攔過。
      - name: Python 語法編譯檢查
        run: python -m compileall -q skills

      # M6 新增：academic-pptx 模板萃取的唯一測試檔，過去公開 CI 沒有實跑過任何測試。
      - name: academic-pptx 模板萃取測試
        run: python skills/academic-pptx/scripts/test_pptx_template_distill.py

      # 結構一致性：私人標記殘留、哨兵殘留、NOTICE 覆蓋率與表格完整、
      # README 技能數、frontmatter 必填與 description 長度上限。
      - name: 結構一致性檢查
        run: python scripts/ci_checks.py .

      # dist/ 的個別安裝包必須與 skills/ 一致。dist 是最容易漂移的地方：
      # 技能改了、新增了，打包檔卻停在舊版，使用者下載到過期內容且毫無跡象。
      - name: dist 與 skills 同步
        run: python scripts/build_dist.py --check

      # SKILL.md 必須是有效的 YAML frontmatter，否則上傳會被拒。
      - name: frontmatter YAML 可解析
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for p in sorted(glob.glob("skills/*/SKILL.md")):
              t = open(p, encoding="utf-8").read()
              if not t.startswith("---"):
                  print(f"[FAIL] {p} 沒有 frontmatter"); bad += 1; continue
              try:
                  fm = yaml.safe_load(t.split("---", 2)[1])
              except Exception as e:
                  print(f"[FAIL] {p} YAML 解析失敗: {e}"); bad += 1; continue
              if not isinstance(fm, dict) or "name" not in fm or "description" not in fm:
                  print(f"[FAIL] {p} frontmatter 缺 name 或 description"); bad += 1
          print("OK" if not bad else f"{bad} 支未通過")
          sys.exit(1 if bad else 0)
          PY
